name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # Syntax errors and undefined names only — the upstream code base is
      # not formatted with ruff, so a full style pass would be noise.
      - run: ruff check --select E9,F63,F7,F82 --target-version py311 app webui main.py deploy
      - run: python -m compileall -q app webui main.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Space image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/huggingface/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
